# MetalLB config: your existing IPv4 pool, unchanged, plus the Pi-hole IPv6 VIP.
# This replaces both your current manifest and the earlier metallb-pihole-ipv6.yaml.
#   kubectl apply -f metallb-config.yaml
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.50.10-192.168.50.15
---
# IPv6 is a separate pool so autoAssign can be off. No other dual-stack or IPv6 Service
# can grab the Pi-hole's address; it's only given out when a Service asks for it by IP.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pool-v6
  namespace: metallb-system
spec:
  addresses:
  - fde0:3fac:9670:50::11/128
  autoAssign: false
---
# Your existing L2Advertisement, with the new pool added. Still one advertisement, and still
# no interface restriction, so behavior is the same as today.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
  - pool
  - pool-v6
