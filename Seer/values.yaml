#
# IMPORTANT NOTE
#
# This chart inherits from our common library chart. You can check the default values/options here:
# https://artifacthub.io/packages/helm/kubernetes-homelab-helm-charts/seerr
#

# seerr values

env: 
  TZ: America/New York
  PORT: 5055

image: 
  tag: v3.2.0
  pullPolicy: IfNotPresent
  repository: "ghcr.io/seerr-team/seerr"

media: 
  mounts: []
  enabled: false
  readOnly: false
  mountPath: /vault
  existingClaim: ""

ingress:
  # -- Enable and configure ingress settings for the chart under this key.
  # @default -- See values.yaml
  main:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: traefik
      ingressClassName: "traefik"
    hosts:
      -
        host: request.idontknow.pro
        paths:
          -
            path: /

service:
  main:
    ports:
      http:
        port: 5055

httpRoute: 
  rules: 
    matches: 
      - path: 
          type: PathPrefix
          value: /
  enabled: false
  hostnames: []
  parentRefs: []

hostDevices: 
  devices: []
  enabled: false

persistence:
  config:
    enabled: true
    type: pvc
    storageClass: "local-path"
    size: 1Gi
    mountPath: /app/config

tolerations: []

extraVolumes: []

nameOverride: ""

replicaCount: 1

livenessProbe: 
  httpGet: 
    path: /api/v1/settings/public
    port: http
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
  initialDelaySeconds: 30

readinessProbe: 
  httpGet: 
    path: /api/v1/settings/public
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  initialDelaySeconds: 20

fullnameOverride: ""

imagePullSecrets: []

extraVolumeMounts: []

extraContainerPorts: []
